spring:
  application:
    name: OfflineDataService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      database: 0
      host: localhost
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092  # Kafka 服务地址，多个用逗号分隔
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      # 真实消费组由 @KafkaListener(groupId=...) 指定：infinite-chat-store-group
      auto-offset-reset: earliest       # earliest / latest / none
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false         # 由容器在每批处理完后提交，失败消息走 DefaultErrorHandler → DLT
      max-poll-records: 100
    listener:
      ack-mode: BATCH
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375
server:
  port: 8101

im:
  store:
    concurrency: 6         # store-topic 消费并发，≤ 分区数

canal:
  server:
    host: localhost
    port: 11111
  destination: example
  username: canal
  password: canal
  # Canal filter 是正则、大小写不敏感；只订阅 message 表，减少无谓 binlog 解析
  filter: "InfiniteChat\\.message"
  client:
    heartbeat:
      interval: 2000    # 心跳间隔(毫秒)
      timeout: 3000    # 心跳超时(毫秒)
    socket:
      timeout: 6000    # socket超时(毫秒)
