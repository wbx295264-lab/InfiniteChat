# 压测 profile：只放与 application.yml 的差异项（UserService 仅在群聊场景被 Feign 调到）
# 启动：--spring.profiles.active=perf
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      leak-detection-threshold: 5000
      pool-name: ${spring.application.name}-hikari
  data:
    redis:
      timeout: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,threaddump
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 20ms,50ms,100ms,200ms,500ms,1s
  endpoint:
    health:
      show-details: always
