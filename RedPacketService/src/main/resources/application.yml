spring:
  application:
    name: RedPacketService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      database: 0
      host: localhost
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
      # 未引入 commons-pool2，lettuce.pool 配置不会生效，已删除；当前为 Lettuce 单共享连接（非池化）
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false         # 由容器在每批处理完后提交，失败消息走 DefaultErrorHandler → DLT
      max-poll-records: 100
    listener:
      ack-mode: BATCH

  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375
    openfeign:
      circuitbreaker:
        enabled: true  # 启用断路器，使 FallbackFactory 生效
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）


server:
  port: 8103


# 红包业务配置
redpacket:
  validation:
    enabled: true  # 是否启用红包发送校验，可用于灰度发布或紧急回滚。关闭后 allow 集合不写入，群红包无人能领，造数阶段绝不能关
