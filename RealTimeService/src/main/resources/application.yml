spring:
  application:
    name: RealTimeService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      database: 0
      host: localhost
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092  # Kafka 服务地址，多个用逗号分隔
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      # 真实消费组由 @KafkaListener(groupId=...) 指定：infinite-chat-push-group-0
      auto-offset-reset: earliest       # earliest / latest / none
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false         # 由容器在每批处理完后提交，失败消息走 DefaultErrorHandler → DLT
      max-poll-records: 100
    listener:
      ack-mode: BATCH
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375


server:
  port: 8102

snowflake:
  workerId: 1
  datacenterId: 1

im:
  auth:
    enabled: true          # WebSocket 握手是否校验 token
  idle:
    reader-seconds: 90     # 读空闲超时（秒），客户端 30s 一次 ping
  push:
    concurrency: 6         # push-topic 消费并发，≤ 分区数
  topic:
    partitions: 6
